<div class="list-container">
  <div class="header-actions">
    <mat-form-field appearance="outline" class="search-filter">
      <mat-label>Buscar facturas</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Cliente o F-001">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="createNew()">
      <mat-icon>add_circle</mat-icon> Nueva Factura
    </button>
  </div>

<div class="mat-elevation-z8 table-container">
  <table mat-table [dataSource]="dataSource">

    <!-- Columna de Número de Factura -->
    <ng-container matColumnDef="invoiceNumber">
      <th mat-header-cell *matHeaderCellDef> Nro. Factura </th>
      <td mat-cell *matCellDef="let element"> {{element.invoiceNumber}} </td>
    </ng-container>

    <!-- Columna de Fecha -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Fecha </th>
      <td mat-cell *matCellDef="let element"> {{element.date | date:'short'}} </td>
    </ng-container>

    <!-- Columna de Cliente -->
    <ng-container matColumnDef="clientName">
      <th mat-header-cell *matHeaderCellDef> Cliente </th>
      <td mat-cell *matCellDef="let element"> {{element.clientName}} </td>
    </ng-container>

    <!-- Columna de Total -->
    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef> Total </th>
      <td mat-cell *matCellDef="let element"> {{element.total | currency}} </td>
    </ng-container>

    <!-- Columna de Estado -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let element"> {{element.status}} </td>
    </ng-container>

    <!-- Columna de Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="accent" [routerLink]="['/facturas/editar', element.id]" matTooltip="Editar Factura">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="primary" [routerLink]="['/facturas/imprimir', element.id]" matTooltip="Imprimir Factura">
          <mat-icon>print</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteInvoice(element.id)" matTooltip="Eliminar Factura">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of invoices">
  </mat-paginator>
</div>
